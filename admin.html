<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Solpass admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1116'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%2317724A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F5F6F8; --paper:#FFFFFF; --ink:#0E1116; --muted:#5B6470; --line:#E4E7EB;
  --sea:#17724A; --sea-soft:#E5F3EB; --sun:#0E1116; --sun-ink:#FFFFFF; --sun-soft:#F5F6F8;
  --ok:#16794C; --ok-soft:#E6F4EC; --warn:#B4452B; --warn-soft:#F8E4DE;
  --display:"Schibsted Grotesk","Helvetica Neue",system-ui,sans-serif;
  --body:"Schibsted Grotesk","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A22; --paper:#16242F; --ink:#EAF1F5; --muted:#9FB2C0; --line:#263845;
  --sea:#72B4E0; --sea-soft:#17324A; --sun-soft:#3A2D13; --ok:#62C394; --ok-soft:#173A2B; --warn:#F08A6E; --warn-soft:#46231A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A22; --paper:#16242F; --ink:#EAF1F5; --muted:#9FB2C0; --line:#263845;
  --sea:#72B4E0; --sea-soft:#17324A; --sun-soft:#3A2D13; --ok:#62C394; --ok-soft:#173A2B; --warn:#F08A6E; --warn-soft:#46231A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:var(--paper);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
.logo{font:700 1.4rem var(--display);letter-spacing:-.04em;display:inline-flex;align-items:center;line-height:1;color:var(--ink)}
.logo i{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--sea);margin:0 .05em 0 .04em;transform:translateY(.1em)}
.tag{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sea)}
.sp{flex:1}
.muted{color:var(--muted)} .small{font-size:.85rem}
h1{font:700 1.8rem var(--display);letter-spacing:-.02em;margin:0}
button,.btn{font:600 .92rem var(--body);border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--sun);color:var(--sun-ink);min-height:40px}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
button.link{background:none;padding:0;min-height:0;color:var(--sea);text-decoration:underline;text-underline-offset:3px}
button:disabled{opacity:.6;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 3px var(--sea-soft)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}
.login{max-width:420px;margin:72px auto;display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0 16px}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font:800 1.7rem var(--body);font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--muted)}
.filters{display:grid;grid-template-columns:1fr 180px auto;gap:10px;align-items:center;margin-bottom:10px}
@media(max-width:720px){.filters{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);padding:6px 12px;min-height:34px;font-size:.85rem;border-radius:8px}
.chip[aria-pressed="true"]{background:var(--sea-soft);color:var(--sea);box-shadow:inset 0 0 0 1.5px var(--sea)}
.list{display:grid;gap:8px;padding-bottom:64px}
.lead{background:var(--paper);border:1px solid var(--line);border-radius:14px}
.lead>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:110px 130px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:14px 16px;cursor:pointer;border-radius:14px}
.lead>button:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
@media(max-width:720px){.lead>button{grid-template-columns:1fr auto}.lead .when,.lead .src{grid-column:1/-1}}
.lead .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead .who b{font-weight:700}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--sun-soft);white-space:nowrap}
.st-new{background:var(--sea-soft);color:var(--sea)} .st-contacted{background:var(--sun-soft)} .st-converted{background:var(--ok-soft);color:var(--ok)} .st-lost,.st-spam{background:var(--warn-soft);color:var(--warn)}
.detail{border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media(max-width:820px){.detail{grid-template-columns:1fr}}
dl{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr);gap:6px 12px;margin:0;font-size:.9rem}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.stack{display:grid;gap:10px;align-content:start}
.err{color:var(--warn)} .ok{color:var(--ok)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap">
  <span class="logo" aria-label="Solpass">s<i aria-hidden="true"></i>lpass</span><span class="tag">Admin</span>
  <span class="sp"></span>
  <span class="small muted" id="who"></span>
  <button class="ghost" id="logout" hidden>Logga ut</button>
</div></header>

<main class="wrap">
  <section class="card login" id="loginView" hidden>
    <h1>Logga in</h1>
    <p class="muted small" style="margin:0">Bara konton som Solpass har gett adminbehörighet ser några leads.</p>
    <form class="stack" id="loginForm">
      <label class="stack small"><span>E-post</span><input type="email" id="loginEmail" required autocomplete="email"></label>
      <label class="stack small"><span>Lösenord</span><input type="password" id="loginPass" required minlength="10" autocomplete="current-password"></label>
      <button type="submit" id="loginBtn">Logga in</button>
      <button type="button" class="link small" id="signupBtn" style="justify-self:start">Första gången? Skapa konto med det här lösenordet</button>
    </form>
    <p class="small" id="loginMsg" role="status"></p>
  </section>

  <section id="appView" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="filters">
      <input type="search" id="q" placeholder="Sök e-post, namn, meddelande" aria-label="Sök">
      <select id="status" aria-label="Status"><option value="">Alla statusar</option></select>
      <div style="display:flex;gap:8px"><button class="ghost" id="refresh">Uppdatera</button><button class="ghost" id="csv">Exportera CSV</button></div>
    </div>
    <div class="chips" id="sources" aria-label="Källa"></div>
    <div class="list" id="list"></div>
  </section>
</main>

<script>
const SB_URL = "https://zdgxdwlztcjtjgxvmfjn.supabase.co";
const SB_KEY = "sb_publishable_1fz_TxUhf9OPesOVSUmsNw_vKKpdqpf";
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, detectSessionInUrl: true, flowType: "implicit" } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const SOURCES = { plan:"Flyttplan", calc:"Ekonomikalkyl", checklist:"Checklista", intro:"Introduktion", question:"Fråga", plus:"Plus", partner:"Leverantör", buyer:"Köprådgivning", home:"Bostadskalkyl", beckham:"Beckham", rentbuy:"Hyra eller köpa" };
const STATUSES = { new:"Ny", contacted:"Kontaktad", converted:"Affär", lost:"Förlorad", spam:"Skräp" };
const FIELD_LABELS = { region:"Region", familj:"Familj", inkomst:"Inkomst", bostad:"Bostad", bil:"Bil", movedate:"Flyttdag", hushall:"Hushåll",
  s1:"Lön person 1", s2:"Lön person 2", cap:"Kapital från Sverige", why:"Orsak", prev:"Bott i Spanien senaste 5 år", eligible:"Kvalificerar", stdTax:"Skatt vanlig IRPF", bkTax:"Skatt Beckham", saving:"Besparing per år",
  price:"Pris", rent:"Hyra per månad", years:"År", down:"Kontantinsats", rate:"Ränta", growth:"Prisutveckling", rentg:"Hyreshöjning", com:"Comunidad", alt:"Alternativavkastning", buyNet:"Köpa netto", rentNet:"Hyra totalt", breakeven:"Brytpunkt år",
  inc:"Bruttoinkomst SEK", adults:"Vuxna", income:"Inkomstkälla", bo:"Boende", kids:"Barn", skola:"Skola", bilar:"Bilar", cost:"Levnadskostnad/mån", netSpain:"Netto Spanien/mån", netSweden:"Netto Sverige/mån", surplus:"Kvar per månad" };
Object.entries(STATUSES).forEach(([k, v]) => $("#status").insertAdjacentHTML("beforeend", `<option value="${k}">${v}</option>`));

let leads = [], source = "", open = null;
const fmtDate = d => new Date(d).toLocaleString("sv-SE", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });

function kv(obj){
  if(!obj || typeof obj !== "object") return "";
  const rows = Object.entries(obj).filter(([, v]) => v !== null && v !== "" && !(typeof v === "object" && !Object.keys(v).length));
  return rows.map(([k, v]) => `<dt>${esc(FIELD_LABELS[k] || k)}</dt><dd>${esc(typeof v === "object" ? JSON.stringify(v, null, 1) : v)}</dd>`).join("");
}
function summary(l){
  const c = l.calc || {}, p = l.profile || {};
  if(l.source === "beckham" && c.saving != null) return c.eligible ? `sparar ${Math.round(c.saving).toLocaleString("sv-SE")} €/år` : "kvalificerar inte";
  if(l.source === "rentbuy" && c.price) return `${Math.round(c.price).toLocaleString("sv-SE")} € · ${c.years} år`;
  if(l.source === "partner") return [l.company, l.category, l.area].filter(Boolean).join(" · ");
  if(l.message) return l.message.slice(0, 90);
  return [p.hushall, p.movedate && "flytt " + p.movedate].filter(Boolean).join(" · ");
}
function filtered(){
  const q = $("#q").value.trim().toLowerCase(), st = $("#status").value;
  return leads.filter(l => (!source || l.source === source) && (!st || l.status === st) &&
    (!q || [l.email, l.name, l.message, l.company, l.phone].some(v => (v || "").toLowerCase().includes(q))));
}
function render(){
  const week = Date.now() - 7 * 86400000;
  const uniq = new Set(leads.map(l => l.email.toLowerCase())).size;
  $("#kpis").innerHTML = [
    [leads.length, "leads totalt"], [leads.filter(l => new Date(l.created_at) > week).length, "senaste 7 dagarna"],
    [leads.filter(l => l.status === "new").length, "ej hanterade"], [uniq, "unika e-postadresser"]
  ].map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");
  const counts = {}; leads.forEach(l => counts[l.source] = (counts[l.source] || 0) + 1);
  $("#sources").innerHTML = `<button class="chip" aria-pressed="${!source}" data-src="">Alla (${leads.length})</button>` +
    Object.keys(SOURCES).filter(k => counts[k]).map(k => `<button class="chip" aria-pressed="${source === k}" data-src="${k}">${SOURCES[k]} (${counts[k]})</button>`).join("");
  document.querySelectorAll("#sources [data-src]").forEach(b => b.onclick = () => { source = b.dataset.src; render(); });
  const rows = filtered();
  $("#list").innerHTML = rows.length ? rows.map(l => `<article class="lead" id="l-${l.id}">
    <button aria-expanded="${open === l.id}" data-open="${l.id}">
      <span class="when small muted">${fmtDate(l.created_at)}</span>
      <span class="src"><span class="pill">${esc(SOURCES[l.source] || l.source)}</span></span>
      <span class="who"><b>${esc(l.name || l.email)}</b>${l.name ? ` <span class="muted small">${esc(l.email)}</span>` : ""}<br><span class="muted small">${esc(summary(l))}</span></span>
      <span class="pill st-${l.status}">${STATUSES[l.status] || l.status}</span>
    </button>
    ${open === l.id ? detail(l) : ""}
  </article>`).join("") : `<div class="empty">${leads.length ? "Inga leads matchar filtret." : "Inga leads ännu. De dyker upp här när besökare lämnar sin e-post på sajten."}</div>`;
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { open = open === b.dataset.open ? null : b.dataset.open; render(); });
  if(open){ const f = $("#f-" + open); if(f) f.onsubmit = e => { e.preventDefault(); saveLead(open); }; }
}
function detail(l){
  const base = { email: l.email, name: l.name, phone: l.phone, company: l.company, category: l.category, area: l.area, partner: l.partner, message: l.message };
  const baseLabels = { email:"E-post", name:"Namn", phone:"Telefon", company:"Företag", category:"Kategori", area:"Område", partner:"Partner", message:"Meddelande" };
  const baseHtml = Object.entries(base).filter(([, v]) => v).map(([k, v]) => `<dt>${baseLabels[k]}</dt><dd>${esc(v)}</dd>`).join("");
  return `<div class="detail">
    <div class="stack">
      <dl>${baseHtml}</dl>
      ${l.profile && Object.keys(l.profile).length ? `<b class="small">Profil</b><dl>${kv(l.profile)}</dl>` : ""}
      ${l.calc && Object.keys(l.calc).length ? `<b class="small">Kalkyl</b><dl>${kv(l.calc)}</dl>` : ""}
    </div>
    <form class="stack" id="f-${l.id}">
      <label class="stack small"><span>Status</span><select name="status">${Object.entries(STATUSES).map(([k, v]) => `<option value="${k}"${l.status === k ? " selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="stack small"><span>Anteckningar</span><textarea name="notes" rows="5">${esc(l.notes || "")}</textarea></label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button type="submit">Spara</button><a class="small" href="mailto:${esc(l.email)}">Mejla ${esc(l.email)}</a></div>
      <p class="small" role="status" id="m-${l.id}">${l.updated_at ? "Senast ändrad " + fmtDate(l.updated_at) : ""}</p>
    </form>
  </div>`;
}
async function saveLead(id){
  const f = $("#f-" + id), msg = $("#m-" + id);
  const row = { status: f.status.value, notes: f.notes.value.trim() || null, updated_at: new Date().toISOString() };
  const { error } = await sb.from("demo_leads").update(row).eq("id", id);
  if(error){ msg.className = "small err"; msg.textContent = "Kunde inte spara: " + error.message; return; }
  Object.assign(leads.find(l => l.id === id), row); render();
  const m = $("#m-" + id); if(m){ m.className = "small ok"; m.textContent = "Sparat."; }
}
async function load(){
  $("#list").innerHTML = `<div class="empty">Hämtar leads…</div>`;
  const { data, error } = await sb.from("demo_leads").select("*").order("created_at", { ascending: false }).limit(2000);
  if(error){ $("#list").innerHTML = `<div class="empty err">Kunde inte hämta leads: ${esc(error.message)}</div>`; return; }
  leads = data || []; render();
}
function csv(){
  const cols = ["created_at","source","status","email","name","phone","company","category","area","partner","message","notes","profile","calc"];
  const cell = v => { const s = v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const text = [cols.join(","), ...filtered().map(l => cols.map(c => cell(l[c])).join(","))].join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" }));
  a.download = `solpass-leads-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

async function show(session){
  if(!session){ $("#loginView").hidden = false; $("#appView").hidden = true; $("#logout").hidden = true; $("#who").textContent = ""; return; }
  $("#who").textContent = session.user.email; $("#logout").hidden = false; $("#loginView").hidden = true;
  const { data: isAdmin } = await sb.rpc("is_admin");
  if(!isAdmin){ $("#appView").hidden = false; $("#kpis").innerHTML = ""; $("#sources").innerHTML = "";
    $("#list").innerHTML = `<div class="empty">${esc(session.user.email)} är inloggad men har inte adminbehörighet än. Säg till i chatten så kopplas kontot.</div>`; return; }
  $("#appView").hidden = false; load();
}
const creds = () => ({ email: $("#loginEmail").value.trim(), password: $("#loginPass").value });
function say(text, cls = "small"){ const m = $("#loginMsg"); m.className = cls; m.textContent = text; }
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); const btn = $("#loginBtn"); btn.disabled = true; say("");
  const { error } = await sb.auth.signInWithPassword(creds());
  btn.disabled = false;
  if(error) say(/confirm/i.test(error.message) ? "Bekräfta först e-postadressen via länken i mejlet från Supabase, logga sedan in här." : "Inloggningen misslyckades: " + error.message, "small err");
};
$("#signupBtn").onclick = async () => {
  if(!$("#loginForm").reportValidity()) return;
  const { data, error } = await sb.auth.signUp(creds());
  if(error) return say("Kontot kunde inte skapas: " + error.message, "small err");
  say(data.session ? "Kontot är skapat och du är inloggad. Be Solpass ge kontot adminbehörighet." : "Kontot är skapat. Klicka på bekräftelselänken i mejlet (sidan den öppnar kan visa fel, det gör inget), logga sedan in här.", "small ok");
};
$("#logout").onclick = () => sb.auth.signOut();
$("#refresh").onclick = load; $("#csv").onclick = csv;
$("#q").oninput = render; $("#status").onchange = render;
sb.auth.onAuthStateChange((event, session) => {
  if(location.hash.includes("access_token")) history.replaceState(null, "", location.pathname);
  if(["INITIAL_SESSION","SIGNED_IN","SIGNED_OUT"].includes(event)) show(session);
});
</script>
</body>
</html>
